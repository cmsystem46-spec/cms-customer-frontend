<div class="fixed inset-0 z-40 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs animate-fade-in">
  <div class="w-full max-w-sm bg-white border border-stone-200/90 rounded-2xl p-6 sm:p-7 text-center shadow-soft animate-scale-up">
    
    <!-- Minimalist Monogram/Check Badge -->
    <div class="w-11 h-11 mx-auto mb-4 bg-stone-100 border border-stone-200/60 rounded-full flex items-center justify-center text-neutral-900">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <h3 class="text-lg font-semibold text-neutral-900 tracking-tight mb-1">Registration Complete</h3>
    <p class="text-xs text-neutral-500 mb-6 leading-relaxed">
      Welcome, <strong class="text-neutral-900 font-medium">{{ userName() }}</strong>. Would you like to provide additional details to finish setting up your customer profile?
    </p>

    <!-- Actions -->
    <div class="space-y-2">
      <button 
        type="button" 
        (click)="onConfirm()"
        class="w-full py-2.5 px-4 bg-neutral-900 hover:bg-neutral-800 text-white text-xs font-medium rounded-xl shadow-sm active:scale-[0.99] transition-all flex items-center justify-center gap-1.5 cursor-pointer">
        <span>Complete Profile</span>
      </button>

      <button 
        type="button" 
        (click)="onSkip()"
        class="w-full py-2 px-4 text-neutral-500 hover:text-neutral-900 text-xs font-medium transition-colors cursor-pointer">
        Skip for now
      </button>
    </div>

  </div>
</div>
