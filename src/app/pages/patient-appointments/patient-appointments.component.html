<div class="space-y-6 pb-12 max-w-6xl mx-auto">

  <!-- Breadcrumb & Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
      <div class="flex items-center gap-2 text-xs text-slate-500 mb-1">
        <a [routerLink]="['/', urlPath()]" class="hover:text-slate-800">Overview</a>
        <span>/</span>
        <span class="text-slate-900 font-medium">Appointments & Tokens</span>
      </div>
      <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">
        Patient Appointments & Consultation History
      </h1>
      <p class="text-xs text-slate-500 mt-0.5">
        Track your scheduled consultations, assigned sequential tokens, and visit status.
      </p>
    </div>

    <button 
      type="button" 
      (click)="goToBooking()"
      class="btn-primary self-start sm:self-auto text-xs cursor-pointer">
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span>Book New Token</span>
    </button>
  </div>

  <!-- Appointments Content -->
  <app-appointment-history 
    [hospitalId]="hospital()?._id"
    (bookNew)="goToBooking()"
    (requestLogin)="showAuthModal.set(true)">
  </app-appointment-history>

  <!-- Auth Modal -->
  @if (showAuthModal()) {
    <app-auth-modal 
      (close)="showAuthModal.set(false)">
    </app-auth-modal>
  }

</div>
