<div class="min-h-screen bg-slate-50 flex items-center justify-center p-6 text-center">
  <div class="max-w-md w-full bg-white p-8 rounded-3xl border border-slate-200 shadow-xl">
    <div class="w-12 h-12 mx-auto rounded-xl bg-sky-600 text-white flex items-center justify-center text-xl mb-4 shadow-sm">
      🏥
    </div>
    <h2 class="text-xl font-bold text-slate-900">Healthcare Network</h2>
    <p class="text-xs text-slate-500 mt-1 mb-6">
      Select a healthcare facility to access appointments and live queue status.
    </p>

    @if (isLoading()) {
      <div class="inline-block w-6 h-6 border-2 border-sky-600 border-t-transparent rounded-full animate-spin"></div>
    } @else if (clinics().length > 0) {
      <div class="space-y-2">
        @for (clinic of clinics(); track clinic._id) {
          <a 
            [routerLink]="['/', clinic.urlPath]"
            class="block p-4 rounded-xl border border-slate-200 hover:border-sky-500 hover:bg-sky-50/40 transition-all text-left group">
            <h4 class="text-sm font-bold text-slate-900 group-hover:text-sky-600">{{ clinic.name }}</h4>
            <p class="text-xs text-slate-400 mt-0.5">{{ clinic.city || clinic.address }}</p>
          </a>
        }
      </div>
    } @else {
      <a 
        routerLink="/city-care-hospital"
        class="inline-block px-5 py-2.5 rounded-lg bg-sky-600 text-white text-xs font-semibold shadow-sm">
        Go to City Care Hospital
      </a>
    }
  </div>
</div>
