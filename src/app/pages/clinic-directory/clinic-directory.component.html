<div class="min-h-screen bg-slate-50 flex items-center justify-center p-6 text-center">
  <div class="max-w-md w-full bg-white p-8 rounded-3xl border border-slate-200 shadow-xl">
    <div class="w-12 h-12 mx-auto rounded-2xl bg-teal-600 text-white flex items-center justify-center text-xl mb-4 shadow-sm">
      🏥
    </div>
    <h2 class="text-xl font-bold text-slate-900">Healthcare Network</h2>
    <p class="text-xs text-slate-500 mt-1 mb-6">
      Redirecting you to the active clinic booking portal...
    </p>

    @if (isLoading()) {
      <div class="inline-block w-6 h-6 border-2 border-teal-600 border-t-transparent rounded-full animate-spin"></div>
    } @else if (clinics().length > 0) {
      <div class="space-y-2">
        @for (clinic of clinics(); track clinic._id) {
          <a 
            [routerLink]="['/', clinic.urlPath]"
            class="block p-4 rounded-2xl border border-slate-200 hover:border-teal-500 hover:bg-teal-50/30 transition-all text-left group">
            <h4 class="text-sm font-bold text-slate-900 group-hover:text-teal-700">{{ clinic.name }}</h4>
            <p class="text-xs text-slate-400 mt-0.5">{{ clinic.city || clinic.address }}</p>
          </a>
        }
      </div>
    } @else {
      <a 
        routerLink="/city-care-hospital"
        class="inline-block px-5 py-2.5 rounded-2xl bg-teal-600 text-white text-xs font-semibold shadow-sm">
        Go to City Care Hospital
      </a>
    }
  </div>
</div>
