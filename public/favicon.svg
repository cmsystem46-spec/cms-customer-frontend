<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="5" y="5" width="118" height="118" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Healthcare Medical Cross with Integrated Pulse Wave -->
  <g filter="url(#subtleShadow)">
    <!-- Vertical Cross Stem -->
    <rect x="48" y="24" width="32" height="80" rx="8" fill="#ffffff"/>
    <!-- Horizontal Cross Bar -->
    <rect x="24" y="48" width="80" height="32" rx="8" fill="#ffffff"/>

    <!-- Pulse / Vital Heartbeat Line Cutout/Accent in Sky Blue -->
    <path d="M 28 64 L 46 64 L 54 50 L 64 78 L 74 54 L 80 64 L 100 64" 
          fill="none" 
          stroke="#0284c7" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Tiny Green Status/Online Accent Dot (Top Right of Cross) -->
  <circle cx="94" cy="34" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
</svg>
